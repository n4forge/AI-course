<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrams made of data — not of symbols</title>
<meta name="description" content="Replace each part of a diagram with a plot of what is happening inside it. A circuit and a beam, both showing every quantity at once, with a ghost of the previous design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0E14; --paper:#ECEFF4; --muted:#8792A6; --line:rgba(135,146,166,.18);
  --amber:#FF6A1A; --cyan:#39C6E8; --page:#ffffff;
  --volt:#3aa9d8; --curr:#e0a020; --ghost:#c8ccd2;
  --shear:#2f8f5b; --mom:#c2410c; --defl:#6d4bd0;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --fs:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--fs);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}

.top{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--fm);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.brand b{color:var(--paper);font-weight:500}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab,.act{min-height:34px;padding:.35em .95em;border-radius:100px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-family:var(--fm);font-size:.76rem;transition:.18s}
.tab:hover,.act:hover{color:var(--paper);border-color:rgba(135,146,166,.5)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:500}
.act{border-radius:8px}
.act:hover{color:var(--amber);border-color:var(--amber)}
.act[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}

.hint{flex:none;text-align:center;font-family:var(--fm);font-size:.72rem;color:var(--muted);
  padding:8px 18px;border-bottom:1px solid var(--line)}
.hint b{color:var(--cyan);font-weight:500}
.hint i{color:var(--ghost);font-style:normal}
.hint span+span{margin-left:16px}

.stage{flex:1;min-height:0;padding:16px;display:flex}
.sheet{flex:1;background:var(--page);border-radius:8px;position:relative;overflow:hidden;
  box-shadow:0 20px 54px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%}

.readout{position:absolute;pointer-events:none;z-index:5;font-family:var(--fm);font-size:.7rem;
  background:rgba(11,14,20,.93);color:var(--paper);border:1px solid rgba(57,198,232,.45);
  border-radius:7px;padding:7px 9px;opacity:0;transition:opacity .12s;white-space:pre;line-height:1.55}
.readout.on{opacity:1}
.readout b{color:var(--cyan);font-weight:500}

.knobs{position:absolute;left:14px;bottom:12px;z-index:6;display:flex;gap:7px;flex-wrap:wrap;
  align-items:center;font-family:var(--fm);font-size:.7rem}
.knob{display:flex;align-items:center;gap:6px;background:#eef1f5;border:1px solid #d3d8de;
  border-radius:100px;padding:4px 10px;color:#3b4250}
.knob input[type=range]{-webkit-appearance:none;appearance:none;width:86px;height:4px;
  background:#c3c9d1;border-radius:3px;outline:none;margin:0}
.knob input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:15px;height:15px;border-radius:50%;background:var(--cyan);border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:grab}
.knob input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:var(--cyan);border:2px solid #fff;cursor:grab}
.knob b{color:#0b0e14;font-weight:600;min-width:4.6em;text-align:right;font-variant-numeric:tabular-nums}
.pill{background:#0b0e14;color:#eceff4;border:0;border-radius:100px;padding:6px 13px;
  font-family:var(--fm);font-size:.7rem}
.pill[aria-pressed="true"]{background:var(--amber);color:#160a02}

@media(max-width:900px){ .stage{padding:8px} .tabs{margin-left:0;width:100%}
  .knobs{position:static;margin:8px;justify-content:center} }
</style>
</head>
<body>

<div class="top">
  <div class="brand">Made of <b>data</b></div>
  <div class="tabs" role="tablist" aria-label="Diagrams"></div>
  <button class="act" id="play" aria-pressed="true">Pause</button>
  <button class="act" id="prev">&larr;</button>
  <span id="stageLabel" style="font-family:var(--fm);font-size:.72rem;color:var(--muted);min-width:5.5em;text-align:center">stage 1/4</span>
  <button class="act" id="next">&rarr;</button>
  <button class="act" id="clearGhost">Clear ghost</button>
</div>

<div class="hint">
  <span><b>Arrow keys</b> build it up, one stage at a time</span>
  <span>Move across it — <b>one cursor reads every plot at once</b></span>
  <span>Change a value and the old shape stays as a <i>grey ghost</i></span>
</div>

<div class="stage">
  <div class="sheet" id="sheet">
    <canvas id="cv"></canvas>
    <div class="readout" id="readout"></div>
    <div class="knobs" id="knobs"></div>
  </div>
</div>

<script>
/* ==========================================================================
   The idea, straight out of the talk.

   A schematic shows you how things are wired and hides every number you
   actually care about. So don't draw the symbol — draw the data, in the
   place where the symbol was. Show every quantity at once instead of
   probing one at a time. And when you change something, keep the old shape
   on screen so you can see what your change did.

   Two diagrams here. The circuit is his. The beam is the same idea moved
   into mechanics: a beam is a network, loads are the sources, and shear and
   moment are the quantities the drawing normally hides.
   ========================================================================== */

const cv=document.getElementById('cv'), g=cv.getContext('2d');
const sheet=document.getElementById('sheet'), readout=document.getElementById('readout');
const knobs=document.getElementById('knobs'), playBtn=document.getElementById('play');
const tabsEl=document.querySelector('.tabs');
const stageLabel=document.getElementById('stageLabel');
let W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(2,devicePixelRatio||1);
  W=sheet.clientWidth; H=sheet.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
addEventListener('resize',resize);

/* ======================= drawing helpers, shared ========================= */
const px=v=>Math.round(v)+0.5;

function frame(x,y,w,h,label,sub){
  g.fillStyle='#fbfcfd'; g.fillRect(x,y,w,h);
  g.strokeStyle='#d7dbe0'; g.lineWidth=1;
  g.strokeRect(px(x),px(y),Math.round(w),Math.round(h));
  if(label){
    g.fillStyle='#5b6472'; g.font='500 11px ' + 'IBM Plex Mono, monospace';
    g.fillText(label, x+7, y+14);
  }
  if(sub){
    g.fillStyle='#9aa2ad'; g.font='10px IBM Plex Mono, monospace';
    g.fillText(sub, x+7, y+27);
  }
}

/* a band of values plotted across a box. series = {data, colour, fill, zero} */
function plot(box, series, opts){
  opts=opts||{};
  const {x,y,w,h}=box;
  let lo=opts.lo, hi=opts.hi;
  if(lo===undefined||hi===undefined){
    lo=Infinity; hi=-Infinity;
    series.forEach(s=>s.data.forEach(v=>{ if(v<lo)lo=v; if(v>hi)hi=v; }));
    if(!isFinite(lo)){ lo=0; hi=1; }
    const pad=(hi-lo)*0.12 || 0.5; lo-=pad; hi+=pad;
  }
  if(hi-lo<1e-12) hi=lo+1;
  const Y=v=>y+h-((v-lo)/(hi-lo))*h;

  if(opts.zeroLine && lo<0 && hi>0){
    g.strokeStyle='#e6e9ec'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,px(Y(0))); g.lineTo(x+w,px(Y(0))); g.stroke();
  }
  series.forEach(s=>{
    const n=s.data.length; if(n<2) return;
    const X=i=>x+(i/(n-1))*w;
    /* upto lets a curve be drawn part-way while keeping the full x scale,
       so it grows left to right the way you draw it by hand */
    const last=opts.upto===undefined? n-1
             : Math.max(1,Math.min(n-1,Math.round(opts.upto*(n-1))));
    if(s.fill){
      g.beginPath(); g.moveTo(X(0),Y(Math.max(lo,Math.min(hi,0))));
      for(let i=0;i<=last;i++) g.lineTo(X(i),Y(s.data[i]));
      g.lineTo(X(last),Y(Math.max(lo,Math.min(hi,0)))); g.closePath();
      g.fillStyle=s.fill; g.fill();
    }
    g.beginPath();
    for(let i=0;i<=last;i++){ const yy=Y(s.data[i]); i?g.lineTo(X(i),yy):g.moveTo(X(i),yy); }
    g.strokeStyle=s.colour; g.lineWidth=s.width||1.7;
    g.lineJoin='round'; g.lineCap='round';
    if(s.dash) g.setLineDash(s.dash);
    g.stroke();
    g.setLineDash([]);
  });
  return {Y,lo,hi};
}

/* ==========================================================================
   1 — THE CIRCUIT.  An astable multivibrator: two transistors that take
   turns switching each other off, which is why the two LEDs alternate.

   The transistor is modelled as a switch that closes once its base reaches
   about 0.7 V and holds the base there while it conducts. Each coupling
   capacitor sits between one collector and the other base, and its branch
   is solved by cases depending on which transistors are conducting. That is
   enough to get the real waveforms and the real period.
   ========================================================================== */
const CIRCUIT={
  VCC:9, VBE:0.7, VSAT:0.15,
  Rb:70000, Rc:1200, C:22e-6,
  T:6,                      /* window actually shown; recomputed per run */
};

function simulateCircuit(p){
  const {VCC,VBE,VSAT}=CIRCUIT;
  const Rb=p.Rb, Rc=p.Rc, C=p.C;
  /* Always show about three and a half cycles, whatever the values are. A
     fixed window meant slow RC combinations showed less than one cycle. */
  const T=Math.max(1.5,Math.min(40, 3.5*1.386*Rb*C));
  const steps=12000, dt=T/steps;
  const keep=900;                              /* points kept for plotting */
  const every=Math.max(1,Math.floor(steps/keep));

  /* u1 across C1 (collector1 -> base2), u2 across C2 (collector2 -> base1).
     Start where the circuit really is the instant Q1 switches on: C1 fully
     charged, so base 2 has just been yanked down to about -VCC. */
  let u1=VCC-VBE, u2=0;
  let on1=true, on2=false;
  const out={t:[],vb1:[],vb2:[],vc1:[],vc2:[],
             iC1:[],iC2:[],iRb1:[],iRb2:[],iRc1:[],iRc2:[],
             vC1:[],vC2:[],vRb1:[],vRb2:[],vRc1:[],vRc2:[]};

  /* One coupling branch: capacitor between a collector and the other base.
     vbFree is the base voltage with NO base-emitter clamp. That is what
     decides whether the transistor conducts. Testing the CLAMPED voltage
     instead makes it latch on for ever, because the clamp holds it at the
     very threshold you are testing against. */
  function branch(u, onColl, onBase){
    let vc, vb, iCap, iRb, iRc;
    const vbFree = onColl ? (VSAT-u)
                          : (VCC - Rc*(-u/(Rc+Rb)) - u);
    if(onColl && !onBase){                     /* collector pinned low, base ramping up */
      vc=VSAT; vb=vc-u;
      iRb=(VCC-vb)/Rb; iCap=-iRb;              /* charge arrives at the base side */
      iRc=(VCC-vc)/Rc;
    } else if(!onColl && onBase){              /* base pinned, collector recovering */
      vb=VBE; vc=vb+u;
      iRc=(VCC-vc)/Rc; iCap=iRc;
      iRb=(VCC-vb)/Rb;
    } else if(!onColl && !onBase){             /* both ends pulled up: cap relaxes */
      iCap=-u/(Rc+Rb);
      vc=VCC-Rc*iCap; vb=vc-u;
      iRc=(VCC-vc)/Rc; iRb=(VCC-vb)/Rb;
    } else {                                   /* both conducting: transient only */
      vc=VSAT; vb=VBE; iCap=0;
      iRc=(VCC-vc)/Rc; iRb=(VCC-vb)/Rb;
    }
    return {vc,vb,vbFree,iCap,iRb,iRc};
  }

  for(let k=0;k<steps;k++){
    const b1=branch(u1,on1,on2);               /* gives vc1 and vb2 */
    const b2=branch(u2,on2,on1);               /* gives vc2 and vb1 */
    const vb1=b2.vb, vb2=b1.vb;

    if(k%every===0){
      out.t.push(k*dt);
      out.vb1.push(vb1); out.vb2.push(vb2);
      out.vc1.push(b1.vc); out.vc2.push(b2.vc);
      out.iC1.push(b1.iCap*1000);  out.iC2.push(b2.iCap*1000);
      out.iRb1.push(b2.iRb*1000);  out.iRb2.push(b1.iRb*1000);
      out.iRc1.push(b1.iRc*1000);  out.iRc2.push(b2.iRc*1000);
      out.vC1.push(u1);            out.vC2.push(u2);
      out.vRb1.push(VCC-vb1);      out.vRb2.push(VCC-vb2);
      out.vRc1.push(VCC-b1.vc);    out.vRc2.push(VCC-b2.vc);
    }
    u1+=b1.iCap/C*dt;
    u2+=b2.iCap/C*dt;
    u1=Math.max(-2*VCC,Math.min(2*VCC,u1));
    u2=Math.max(-2*VCC,Math.min(2*VCC,u2));
    on2=b1.vbFree>=VBE;                        /* unclamped, or it latches */
    on1=b2.vbFree>=VBE;
  }
  out.T=T;
  return out;
}

/* How long is one full cycle? Measured off the collector, which swings the
   whole rail — the base is clamped at 0.7 V and never crosses anything. */
function measurePeriod(sig,t,mid){
  mid=mid===undefined?4.5:mid;
  const cross=[];
  for(let i=1;i<sig.length;i++)
    if(sig[i-1]<mid && sig[i]>=mid) cross.push(t[i]);
  if(cross.length>=3){                    /* skip the first, it is startup */
    let sum=0;
    for(let i=2;i<cross.length;i++) sum+=cross[i]-cross[i-1];
    return sum/(cross.length-2);
  }
  if(cross.length===2) return cross[1]-cross[0];
  return null;
}

/* eight parts of the circuit, in the order the signal goes round */
const PARTS=[
  {id:'C1', name:'22uF',  what:'coupling capacitor', v:'vC1', i:'iC1'},
  {id:'Rb2',name:'70k',   what:'base resistor',      v:'vRb2',i:'iRb2'},
  {id:'Q2', name:'Q2',    what:'transistor',         v:'vc2', i:'iRc2'},
  {id:'L2', name:'1.2k',  what:'LED branch',         v:'vRc2',i:'iRc2'},
  {id:'C2', name:'22uF',  what:'coupling capacitor', v:'vC2', i:'iC2'},
  {id:'Rb1',name:'70k',   what:'base resistor',      v:'vRb1',i:'iRb1'},
  {id:'Q1', name:'Q1',    what:'transistor',         v:'vc1', i:'iRc1'},
  {id:'L1', name:'1.2k',  what:'LED branch',         v:'vRc1',i:'iRc1'},
];

/* ==========================================================================
   2 — THE BEAM.  Same move. The drawing normally shows arrows and hides
   shear, moment, slope and deflection, and we make students integrate it
   twice in their heads. So put all four on one x axis, in place.

   Shear and moment come straight from statics. Deflection is the double
   integral of M/EI done numerically, so it works for any set of loads
   without looking up a formula.
   ========================================================================== */
const BEAM={ L:6, EI:8000, w:4, N:400, fixed:false,
             loads:[{a:2.0,P:12},{a:4.2,P:8}] };

function simulateBeam(b){
  const N=b.N, L=b.L, dx=L/(N-1);
  const x=new Array(N), V=new Array(N), M=new Array(N);
  const sumP=b.loads.reduce((s,l)=>s+l.P,0);

  let Ra=0;
  if(!b.fixed){                         /* simply supported: moments about A */
    Ra=(b.loads.reduce((s,l)=>s+l.P*(L-l.a),0) + b.w*L*L/2)/L;
  }
  for(let i=0;i<N;i++){
    const xi=i*dx; x[i]=xi;
    if(!b.fixed){
      let v=Ra-b.w*xi, m=Ra*xi-b.w*xi*xi/2;
      b.loads.forEach(l=>{ if(xi>l.a){ v-=l.P; m-=l.P*(xi-l.a); } });
      V[i]=v; M[i]=m;
    } else {                            /* cantilever built in at the left */
      let v=0, m=0;
      b.loads.forEach(l=>{ if(l.a>=xi){ v+=l.P; m-=l.P*(l.a-xi); } });
      const rem=L-xi;
      v+=b.w*rem; m-=b.w*rem*rem/2;
      V[i]=v; M[i]=m;
    }
  }

  /* theta and delta by trapezoid, then satisfy the boundary conditions */
  const th=new Array(N).fill(0), d=new Array(N).fill(0);
  for(let i=1;i<N;i++) th[i]=th[i-1]+(M[i]+M[i-1])/2/b.EI*dx;
  for(let i=1;i<N;i++) d[i]=d[i-1]+(th[i]+th[i-1])/2*dx;
  if(!b.fixed){                         /* d(0)=0 already; force d(L)=0 */
    const slope=d[N-1]/L;
    for(let i=0;i<N;i++){ d[i]-=slope*x[i]; th[i]-=slope; }
  }
  return {x,V,M,th,d,Ra,Rb:sumP+b.w*L-Ra,sumP};
}

/* ==========================================================================
   The views. Both are STAGED: you drive them with the arrow keys, and each
   press replaces a little more of the drawing with the data inside it.
   ========================================================================== */
let view='circuit', stage=0, running=true, t0=performance.now();
let circuitNow=null, circuitGhost=null, beamNow=null, beamGhost=null;
let cursor=null;
const STAGES={circuit:4, beam:4};

function recompute(keepGhost){
  if(view==='circuit'){
    if(!keepGhost && circuitNow) circuitGhost=circuitNow;
    circuitNow=simulateCircuit(CIRCUIT);
  } else {
    if(!keepGhost && beamNow) beamGhost=beamNow;
    beamNow=simulateBeam(BEAM);
  }
}

/* ====================== schematic symbols, in ink ======================== */
const INK='#111';
function wire(pts){
  g.strokeStyle=INK; g.lineWidth=2.4; g.lineJoin='miter'; g.lineCap='butt';
  g.beginPath();
  pts.forEach((p,i)=>i?g.lineTo(px(p[0]),px(p[1])):g.moveTo(px(p[0]),px(p[1])));
  g.stroke();
}
function supply(x,y){                    /* open triangle pointing up */
  g.strokeStyle=INK; g.lineWidth=2.4;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x-11,y+20); g.lineTo(x+11,y+20); g.closePath(); g.stroke();
}
function ground(x,y){                    /* open triangle pointing down */
  g.strokeStyle=INK; g.lineWidth=2.4;
  g.beginPath(); g.moveTo(x,y+20); g.lineTo(x-11,y); g.lineTo(x+11,y); g.closePath(); g.stroke();
}
function resistorV(x,y,h,label){         /* vertical zigzag */
  const n=6, step=h/n;
  g.strokeStyle=INK; g.lineWidth=2.4; g.lineJoin='round'; g.lineCap='round';
  g.beginPath(); g.moveTo(x,y);
  for(let i=0;i<n;i++) g.lineTo(x+(i%2?-7:7), y+step*(i+0.5));
  g.lineTo(x,y+h); g.stroke();
  if(label){ g.fillStyle=INK; g.font='500 13px IBM Plex Sans, sans-serif';
             g.textAlign='right'; g.fillText(label,x-13,y+h/2+5); g.textAlign='left'; }
}
function capacitorH(x,y,label){          /* two plates, in a horizontal wire */
  g.strokeStyle=INK; g.lineWidth=3.2; g.lineCap='butt';
  g.beginPath(); g.moveTo(px(x-5),y-14); g.lineTo(px(x-5),y+14);
  g.moveTo(px(x+5),y-14); g.lineTo(px(x+5),y+14); g.stroke();
  if(label){ g.fillStyle=INK; g.font='500 13px IBM Plex Sans, sans-serif';
             g.textAlign='center'; g.fillText(label,x,y+34); g.textAlign='left'; }
}
function led(x,y,lit){                   /* triangle, bar, and two rays */
  g.strokeStyle=INK; g.fillStyle=lit?'#ff3b30':INK; g.lineWidth=2.4;
  g.beginPath(); g.moveTo(x-11,y); g.lineTo(x+11,y); g.lineTo(x,y+17); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(px(x-11),py(y+18)); g.lineTo(px(x+11),py(y+18)); g.stroke();
  g.strokeStyle=lit?'#ff3b30':INK; g.lineWidth=2;
  [0,1].forEach(k=>{ const o=k*9;
    g.beginPath(); g.moveTo(x+13+o,y+2); g.lineTo(x+20+o,y-6);
    g.lineTo(x+17.5+o,y-2.5); g.moveTo(x+20+o,y-6); g.lineTo(x+19+o,y-2); g.stroke(); });
}
const py=v=>Math.round(v)+0.5;
function transistor(x,y,lit){            /* NPN: circle, base bar, two legs */
  g.strokeStyle=INK; g.lineWidth=2.4; g.fillStyle='#fff';
  g.beginPath(); g.arc(x,y,20,0,6.2832); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(px(x-6),y-13); g.lineTo(px(x-6),y+13); g.stroke();   /* base bar */
  g.beginPath(); g.moveTo(x-20,y); g.lineTo(x-6,y); g.stroke();                /* base lead */
  g.beginPath(); g.moveTo(x-6,y-6); g.lineTo(x+11,y-17); g.lineTo(x+11,y-26); g.stroke();
  g.beginPath(); g.moveTo(x-6,y+6); g.lineTo(x+11,y+17); g.lineTo(x+11,y+26); g.stroke();
  const a=Math.atan2(17,17);                                                   /* emitter arrow */
  g.beginPath(); g.moveTo(x+11,y+17);
  g.lineTo(x+11-9*Math.cos(a-0.4), y+17-9*Math.sin(a-0.4));
  g.lineTo(x+11-9*Math.cos(a+0.4), y+17-9*Math.sin(a+0.4));
  g.closePath(); g.fillStyle=lit?'#ff3b30':INK; g.fill();
}

/* a data box that sits IN the wire, the way the talk does it */
function dataBox(b,series){
  g.save();
  g.shadowColor='rgba(0,0,0,.16)'; g.shadowBlur=7; g.shadowOffsetY=2;
  g.fillStyle='#fff'; g.fillRect(b.x,b.y,b.w,b.h);
  g.restore();
  g.strokeStyle='#d6dade'; g.lineWidth=1; g.strokeRect(px(b.x),px(b.y),Math.round(b.w),Math.round(b.h));
  const each=b.h/series.length;
  series.forEach((s,i)=>{
    const cell={x:b.x+2,y:b.y+i*each+2,w:b.w-4,h:each-4};
    /* one scale for both, worked out before either is drawn */
    let lo=s.lo, hi=s.hi;
    if(lo===undefined||hi===undefined){
      lo=Infinity; hi=-Infinity;
      [s.data, s.ghost].forEach(arr=>arr&&arr.forEach(v=>{ if(v<lo)lo=v; if(v>hi)hi=v; }));
      if(!isFinite(lo)){ lo=0; hi=1; }
      const pd=(hi-lo)*0.12||0.5; lo-=pd; hi+=pd;
    }
    plot(cell,[{data:s.data,colour:s.line,fill:s.fill,width:1.6}],{lo,hi});
    /* the old shape goes ON TOP, or the fill hides it completely */
    if(s.ghost) plot(cell,[{data:s.ghost,colour:'#6b7280',width:1.7,dash:[5,4]}],{lo,hi});
    if(i) { g.strokeStyle='#e8ebee'; g.lineWidth=1;
            g.beginPath(); g.moveTo(b.x,px(b.y+i*each)); g.lineTo(b.x+b.w,px(b.y+i*each)); g.stroke(); }
  });
}

/* ============================ the circuit view ==========================
   Astable multivibrator, drawn as a real schematic. Left to right along the
   bottom wire: 22uF, base node 1, Q1, collector node 1, 22uF, base node 2,
   Q2, collector node 2, and a long wire wrapping back to the start.
   ======================================================================== */
function circuitLayout(spread){
  const gap=spread?150:96;                 /* stages 3-4 open up to make room */
  const total=gap*8;
  const x0=(W-total)/2+30;
  const X=k=>x0+k*gap;
  return {
    X, gap, spread,
    yRail:  H*0.16,                        /* supply triangles sit here */
    yTop:   H*0.30,                        /* resistors / LEDs */
    yMain:  H*0.62,                        /* the main horizontal wire */
    yGnd:   H*0.78,
    left:   X(0)-40, right: X(8)+40,
    yWrap:  H*0.90,
    cap2:X(0.6), b1:X(1.7), q1:X(2.7), c1:X(3.6),
    cap1:X(4.4), b2:X(5.6), q2:X(6.6), c2:X(7.5)
  };
}

function drawCircuit(){
  const d=circuitNow, gh=circuitGhost, L=circuitLayout(stage>=2);
  const WIN=d.T||6;
  const tt=running? ((performance.now()-t0)/1000)%WIN : (cursor!==null?cursor*WIN:0);
  const idx=Math.min(d.t.length-1,Math.max(0,Math.round(tt/WIN*(d.t.length-1))));
  const lit1=d.iRc1[idx]>3, lit2=d.iRc2[idx]>3;

  /* ---- the wires. These never change; only what sits in them changes ---- */
  const yM=L.yMain, yT=L.yTop, yR=L.yRail;
  wire([[L.left,yM],[L.cap2-5,yM]]);
  wire([[L.cap2+5,yM],[L.q1-20,yM]]);
  wire([[L.q1+11,yM+26],[L.q1+11,L.yGnd]]);                 /* Q1 emitter down */
  wire([[L.q1+11,yM-26],[L.q1+11,yT+34],[L.c1,yT+34]]);     /* Q1 collector up */
  wire([[L.c1,yT+34],[L.c1,yM],[L.cap1-5,yM]]);
  wire([[L.cap1+5,yM],[L.q2-20,yM]]);
  wire([[L.q2+11,yM+26],[L.q2+11,L.yGnd]]);
  wire([[L.q2+11,yM-26],[L.q2+11,yT+34],[L.c2,yT+34]]);
  wire([[L.c2,yT+34],[L.c2,yM],[L.right,yM],[L.right,L.yWrap],
        [L.left,L.yWrap],[L.left,yM]]);                      /* the long wrap */
  wire([[L.b1,yM],[L.b1,yT+34]]);  wire([[L.b1,yT-34],[L.b1,yR+20]]);
  wire([[L.b2,yM],[L.b2,yT+34]]);  wire([[L.b2,yT-34],[L.b2,yR+20]]);
  wire([[L.c1,yT+34],[L.c1,yT+22]]); wire([[L.c1,yT-34],[L.c1,yR+20]]);
  wire([[L.c2,yT+34],[L.c2,yT+22]]); wire([[L.c2,yT-34],[L.c2,yR+20]]);

  supply(L.b1,yR); supply(L.c1,yR); supply(L.b2,yR); supply(L.c2,yR);
  ground(L.q1+11,L.yGnd); ground(L.q2+11,L.yGnd);

  /* ---- the parts that always stay symbols ---- */
  capacitorH(L.cap2,yM,'22uF'); capacitorH(L.cap1,yM,'22uF');
  transistor(L.q1,yM,lit1); transistor(L.q2,yM,lit2);
  resistorV(L.b1,yT-34,68,(CIRCUIT.Rb/1000).toFixed(0)+'k');
  resistorV(L.b2,yT-34,68,(CIRCUIT.Rb/1000).toFixed(0)+'k');
  resistorV(L.c1,yT+2,32,(CIRCUIT.Rc/1000).toFixed(1)+'k');
  resistorV(L.c2,yT+2,32,(CIRCUIT.Rc/1000).toFixed(1)+'k');
  led(L.c1,yT-34,lit1); led(L.c2,yT-34,lit2);

  /* ---- and the parts that become data ---- */
  const bw=L.spread?128:92, bh=44;
  const V={line:'#5bb3dd',fill:'rgba(120,195,230,.55)'};
  const I={line:'#d9a521',fill:'rgba(232,180,50,.85)'};
  const slots=[
    {n:0, x:L.cap2+22,      y:yM-bh/2, w:bw, h:bh, i:'iC2',  v:'vb1'},
    {n:1, x:L.b1-bw/2,      y:yT+44,   w:bw, h:bh, i:'iRb1', v:'vb1'},
    {n:2, x:L.q1+26,        y:yM-bh/2, w:bw, h:bh, i:'iRc1', v:'vc1'},
    {n:3, x:L.c1-bw/2,      y:yT-96,   w:bw, h:bh, i:'iRc1', v:'vc1'},
    {n:4, x:L.cap1+22,      y:yM-bh/2, w:bw, h:bh, i:'iC1',  v:'vb2'},
    {n:5, x:L.b2-bw/2,      y:yT+44,   w:bw, h:bh, i:'iRb2', v:'vb2'},
    {n:6, x:L.q2+26,        y:yM-bh/2, w:bw, h:bh, i:'iRc2', v:'vc2'},
    {n:7, x:L.c2-bw/2,      y:yT-96,   w:bw, h:bh, i:'iRc2', v:'vc2'},
  ];
  const shown = stage===0 ? [] : stage===1 ? [7] : slots.map(s=>s.n);
  const boxes=[];
  slots.forEach(s=>{
    if(!shown.includes(s.n)) return;
    const series=[];
    if(stage>=3) series.push({...V,data:d[s.v],ghost:gh&&gh[s.v],lo:-1,hi:CIRCUIT.VCC+1});
    series.push({...I,data:d[s.i],ghost:gh&&gh[s.i]});
    const box={x:s.x,y:stage>=3?s.y-bh/2:s.y,w:s.w,h:stage>=3?bh*2:bh};
    dataBox(box,series); boxes.push({box,s,series});
  });

  /* One cursor across every plot — but only while the pointer is actually
     over one of them, and with no text panel floating over the schematic. */
  hoverBoxes=boxes.map(b=>b.box);
  if(cursor!==null && boxes.length){
    boxes.forEach(({box})=>{
      const cx=box.x+cursor*box.w;
      g.strokeStyle='rgba(255,106,26,.9)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(px(cx),box.y); g.lineTo(px(cx),box.y+box.h); g.stroke();
    });
  }
  hideReadout();

  caption([
    'the schematic. it shows how it is wired, and hides every number.',
    'one wire replaced by the current flowing through it.',
    'now all of them. the drawing is made of data.',
    'voltage in blue above current in amber. nothing is hidden.'
  ][stage], measurePeriod(d.vc1,d.t,CIRCUIT.VCC/2));
}

/* ============================== the beam view ===========================
   Drawn the way it is drawn by hand: beam, then reactions, then the shear
   built left to right jump by jump, then the moment accumulated as the area
   under that shear, then the shape it bends into. One arrow press per step.
   ======================================================================== */
function beamPlan(){
  const ev=[...new Set([0,...BEAM.loads.map(l=>+l.a.toFixed(4)),+BEAM.L.toFixed(4)])]
            .sort((a,b)=>a-b).filter(v=>v>=0&&v<=BEAM.L);
  const plan=[{k:'beam'},{k:'react'}];
  for(let i=1;i<ev.length;i++) plan.push({k:'shear',from:ev[i-1],to:ev[i]});
  for(let i=1;i<ev.length;i++) plan.push({k:'moment',from:ev[i-1],to:ev[i]});
  plan.push({k:'defl'});
  return plan;
}

function drawBeam(){
  const b=beamNow, gh=beamGhost, plan=beamPlan();
  STAGES.beam=plan.length;
  const st=plan[Math.min(stage,plan.length-1)];
  const shown={beam:1,react:2,shear:3,moment:4,defl:5}[st.k];

  const pad=76, right=W-40, wpx=right-pad;
  const bands=1+(shown>=3?1:0)+(shown>=4?1:0)+(shown>=5?1:0);
  const top=78, avail=H-top-104, rh=avail/Math.max(2,bands);
  const X=xx=>pad+(xx/BEAM.L)*wpx;
  const at=xx=>Math.min(b.x.length-1,Math.max(0,Math.round(xx/BEAM.L*(b.x.length-1))));

  /* ---------------- band 1: the beam itself ---------------- */
  const y0=top+rh*0.55;
  g.strokeStyle=INK; g.lineWidth=8; g.lineCap='butt';
  g.beginPath(); g.moveTo(X(0),y0); g.lineTo(X(BEAM.L),y0); g.stroke();
  if(BEAM.fixed) { g.fillStyle=INK; g.fillRect(X(0)-13,y0-34,11,68); }
  else [0,BEAM.L].forEach((xx,k)=>{
    g.beginPath(); g.moveTo(X(xx),y0+5); g.lineTo(X(xx)-14,y0+27); g.lineTo(X(xx)+14,y0+27);
    g.closePath(); g.fillStyle=INK; g.fill();
    if(shown>=2){                              /* reactions appear at step 2 */
      g.strokeStyle='#1d7a4f'; g.lineWidth=3;
      g.beginPath(); g.moveTo(X(xx),y0+58); g.lineTo(X(xx),y0+30); g.stroke();
      g.beginPath(); g.moveTo(X(xx),y0+28); g.lineTo(X(xx)-6,y0+40); g.lineTo(X(xx)+6,y0+40);
      g.closePath(); g.fillStyle='#1d7a4f'; g.fill();
      g.font='500 12px IBM Plex Mono, monospace'; g.textAlign='center';
      g.fillText((k?b.Rb:b.Ra).toFixed(1)+' kN', X(xx), y0+74); g.textAlign='left';
    }
  });
  if(BEAM.w>0){
    g.fillStyle='rgba(17,17,17,.10)'; g.fillRect(X(0),y0-28,wpx,23);
    g.fillStyle='#5b6472'; g.font='12px IBM Plex Mono, monospace';
    g.fillText(BEAM.w.toFixed(1)+' kN/m', X(0)+7, y0-34);
  }
  loadHandles={};
  BEAM.loads.forEach((l,k)=>{
    const xx=X(l.a), len=20+l.P*2.4;
    g.strokeStyle='#c2410c'; g.lineWidth=3;
    g.beginPath(); g.moveTo(xx,y0-len); g.lineTo(xx,y0-6); g.stroke();
    g.beginPath(); g.moveTo(xx,y0-4); g.lineTo(xx-7,y0-16); g.lineTo(xx+7,y0-16);
    g.closePath(); g.fillStyle='#c2410c'; g.fill();
    g.font='500 12px IBM Plex Mono, monospace'; g.textAlign='center';
    g.fillText(l.P.toFixed(1)+' kN', xx, y0-len-8); g.textAlign='left';
    loadHandles[k]={x:xx,y:y0-len};
  });

  /* how far along has the construction got? */
  const front = st.k==='shear'||st.k==='moment' ? st.to : BEAM.L;
  const metrics=[]; let row=1;

  function band(label,unit,key,colour,fill,scale,upto,strongFill){
    const y=top+rh*row, box={x:pad,y:y+22,w:wpx,h:rh-40}; row++;
    g.fillStyle='#6b7280'; g.font='500 12px IBM Plex Mono, monospace';
    g.fillText(label+'   '+unit, pad, y+14);
    const series=[];
    if(gh&&upto===undefined) series.push({data:gh[key].map(v=>v*scale),colour:'#cfd3d8',width:1.4});
    series.push({data:b[key].map(v=>v*scale),colour,
                 fill:strongFill||fill,width:2.2});
    const m=plot(box,series,{zeroLine:true,upto});
    metrics.push({key,box,m,scale});
    return {box,m};
  }

  /* ---------------- band 2: shear ---------------- */
  if(shown>=3){
    const upto = st.k==='shear' ? front/BEAM.L : undefined;
    /* while the moment is being accumulated, the shear area is the thing to
       look at, so it is filled solid rather than washed out */
    const strong = st.k==='moment' ? 'rgba(47,143,91,.42)' : null;
    const r=band('shear  V(x)','kN','V','#2f8f5b','rgba(47,143,91,.22)',1,
                 st.k==='moment'? front/BEAM.L : upto, strong);
    if(st.k==='shear'){
      const i0=at(st.from), i1=at(st.to);
      g.fillStyle='#1d7a4f'; g.font='500 12px IBM Plex Mono, monospace'; g.textAlign='center';
      if(st.from===0){
        g.fillText('+'+b.Ra.toFixed(1)+' at the support', X(0)+58, r.m.Y(b.V[0])-10);
      } else {
        const jump=b.V[i0]-b.V[Math.max(0,i0-1)];
        const L2=BEAM.loads.find(l=>Math.abs(l.a-st.from)<1e-3);
        if(L2) g.fillText('drops '+L2.P.toFixed(1),X(st.from),r.m.Y(b.V[i0])-10);
      }
      if(BEAM.w>0) g.fillText('slopes down at '+BEAM.w.toFixed(1)+' kN/m',
                              (X(st.from)+X(st.to))/2, r.box.y+r.box.h-8);
      g.textAlign='left';
    }
  }

  /* ---------------- band 3: moment ---------------- */
  if(shown>=4){
    const upto = st.k==='moment' ? front/BEAM.L : undefined;
    const r=band('moment  M(x)','kNm','M','#c2410c','rgba(194,65,12,.22)',1,upto);
    if(st.k==='moment'){
      g.fillStyle='#c2410c'; g.font='500 12px IBM Plex Mono, monospace'; g.textAlign='center';
      g.fillText('area under the shear so far  =  '+b.M[at(front)].toFixed(1)+' kNm',
                 (X(0)+X(front))/2, r.box.y-6);
      g.textAlign='left';
    }
  }

  /* ---------------- band 4: deflection ---------------- */
  if(shown>=5) band('deflection','mm','d','#6d4bd0','rgba(109,75,208,.20)',1000);

  /* the construction front, drawn down every band */
  if(st.k==='shear'||st.k==='moment'){
    g.strokeStyle='rgba(17,17,17,.35)'; g.lineWidth=1.5; g.setLineDash([5,4]);
    g.beginPath(); g.moveTo(px(X(front)),top+8); g.lineTo(px(X(front)),top+rh*bands-24); g.stroke();
    g.setLineDash([]);
  }

  /* one x axis for the whole thing, so point anywhere across it — over the
     beam, over any band, the gaps between them. Scoping this to individual
     plot boxes made the most natural place to point do nothing. */
  hoverBoxes=[{x:pad,y:top,w:wpx,h:rh*bands}];
  if(cursor!==null && metrics.length){
    const xx=cursor*BEAM.L, i=at(xx);
    g.strokeStyle='rgba(255,106,26,.9)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(px(X(xx)),top+6); g.lineTo(px(X(xx)),top+rh*bands-24); g.stroke();
    metrics.forEach(mm=>{ g.fillStyle='#ff6a1a';
      g.beginPath(); g.arc(X(xx),mm.m.Y(b[mm.key][i]*mm.scale),4,0,6.2832); g.fill(); });
    showReadout('x = '+xx.toFixed(2)+' m\nV   '+b.V[i].toFixed(2).padStart(8)+' kN\n'
      +'M   '+b.M[i].toFixed(2).padStart(8)+' kNm\ndef '+(b.d[i]*1000).toFixed(2).padStart(8)+' mm',cursor);
  } else hideReadout();

  /* the two places worth knowing, marked permanently once they exist */
  const Mmax=Math.max(...b.M.map(Math.abs)), dmax=Math.max(...b.d.map(Math.abs));
  const iM=b.M.indexOf(Math.max(...b.M)), iD=b.d.map(Math.abs).indexOf(dmax);
  function peak(mm,i,colour,text){
    if(!mm) return;
    const cx=X(b.x[i]), cy=mm.m.Y(b[mm.key][i]*mm.scale);
    g.strokeStyle=colour; g.lineWidth=1.5; g.setLineDash([3,3]);
    g.beginPath(); g.moveTo(px(cx),cy); g.lineTo(px(cx),mm.box.y+mm.box.h); g.stroke();
    g.setLineDash([]);
    g.fillStyle=colour;
    g.beginPath(); g.arc(cx,cy,5,0,6.2832); g.fill();
    g.font='500 12px IBM Plex Mono, monospace'; g.textAlign='center';
    g.fillText(text, Math.max(60,Math.min(W-70,cx)), cy-11); g.textAlign='left';
  }
  if(st.k==='defl'){
    peak(metrics.find(m=>m.key==='M'), iM, '#c2410c',
         Mmax.toFixed(1)+' kNm at x '+b.x[iM].toFixed(2)+' m');
    peak(metrics.find(m=>m.key==='d'), iD, '#6d4bd0',
         (dmax*1000).toFixed(1)+' mm at x '+b.x[iD].toFixed(2)+' m');
  }
  let cap='', extra=null;
  if(st.k==='beam')   cap='the beam and its loads. nothing else is known yet.';
  if(st.k==='react')  cap='reactions first: moments about the left support give '
                          +b.Ra.toFixed(1)+' kN, then vertical equilibrium gives '+b.Rb.toFixed(1)+' kN.';
  if(st.k==='shear')  cap='shear, built left to right — from x = '+st.from.toFixed(2)
                          +' m to '+st.to.toFixed(2)+' m.';
  if(st.k==='moment') cap='moment is the running area under the shear diagram above it.';
  if(st.k==='defl'){  cap='and the shape it bends into.';
                      extra='max M '+Mmax.toFixed(1)+' kNm at x '+b.x[iM].toFixed(2)
                           +' m   ·   max deflection '+(dmax*1000).toFixed(1)
                           +' mm at x '+b.x[iD].toFixed(2)+' m — not the same place'; }
  caption(cap,null,extra);
}

let loadHandles={}, hoverBoxes=[];

function caption(text,period,extra){
  g.fillStyle='#2b313a'; g.font='500 14px IBM Plex Sans, sans-serif';
  g.fillText(text, 40, 34);
  g.fillStyle='#9aa2ad'; g.font='12px IBM Plex Mono, monospace';
  let s='stage '+(stage+1)+' of '+STAGES[view]+'   —   arrow keys';
  if(period) s+='    ·    one flash cycle '+period.toFixed(2)+' s';
  if(extra) s+='    ·    '+extra;
  g.fillText(s, 40, 54);
}
function showReadout(text,at){
  readout.textContent=text; readout.classList.add('on');
  const w=readout.offsetWidth||170;
  readout.style.left=Math.max(8,Math.min(W-w-8, at*W-w/2))+'px';
  readout.style.top='68px';
}
function hideReadout(){ readout.classList.remove('on'); }

function draw(){
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  g.textAlign='left'; g.textBaseline='alphabetic';
  if(view==='circuit'){ if(!circuitNow) recompute(true); drawCircuit(); }
  else { if(!beamNow) recompute(true); drawBeam(); }
}
function loop(){ if(running&&view==='circuit') draw(); requestAnimationFrame(loop); }

/* =============================== the knobs =============================== */
function knob(label,min,max,step,get,set,fmt){
  const d=document.createElement('label'); d.className='knob';
  d.innerHTML='<span>'+label+'</span><input type="range" min="'+min+'" max="'+max+'" step="'+step+'"><b></b>';
  const inp=d.querySelector('input'), out=d.querySelector('b');
  inp.value=get(); out.textContent=fmt(get());
  inp.addEventListener('input',()=>{ set(parseFloat(inp.value)); out.textContent=fmt(get());
                                     recompute(false); draw(); });
  knobs.appendChild(d);
}
function buildKnobs(){
  knobs.innerHTML='';
  if(view==='circuit'){
    knob('base R',10000,200000,1000,()=>CIRCUIT.Rb,v=>CIRCUIT.Rb=v,v=>(v/1000).toFixed(0)+' k');
    knob('collector R',200,5000,50,()=>CIRCUIT.Rc,v=>CIRCUIT.Rc=v,v=>(v/1000).toFixed(1)+' k');
    knob('cap',1e-6,68e-6,1e-6,()=>CIRCUIT.C,v=>CIRCUIT.C=v,v=>(v*1e6).toFixed(0)+' uF');
    knob('supply',3,15,0.5,()=>CIRCUIT.VCC,v=>CIRCUIT.VCC=v,v=>v.toFixed(1)+' V');
  } else {
    knob('span',3,12,0.5,()=>BEAM.L,v=>{BEAM.L=v;BEAM.loads.forEach(l=>l.a=Math.min(l.a,v));},v=>v.toFixed(1)+' m');
    knob('UDL',0,20,0.5,()=>BEAM.w,v=>BEAM.w=v,v=>v.toFixed(1)+' kN/m');
    knob('EI',1000,40000,500,()=>BEAM.EI,v=>BEAM.EI=v,v=>(v/1000).toFixed(1)+'e3');
    const p=document.createElement('button');
    p.className='pill'; p.setAttribute('aria-pressed',String(BEAM.fixed));
    p.textContent=BEAM.fixed?'cantilever':'simply supported';
    p.onclick=()=>{ BEAM.fixed=!BEAM.fixed; p.setAttribute('aria-pressed',String(BEAM.fixed));
                    p.textContent=BEAM.fixed?'cantilever':'simply supported';
                    recompute(false); draw(); };
    knobs.appendChild(p);
  }
}

/* ============================ driving it ================================ */
function setStage(n){
  stage=Math.max(0,Math.min(STAGES[view]-1,n));
  stageLabel.textContent='stage '+(stage+1)+'/'+STAGES[view];
  draw();
}
addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); setStage(stage+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); setStage(stage-1); }
  else if(e.key==='Home'){ setStage(0); }
  else if(e.key==='End'){ setStage(STAGES[view]-1); }
});

let dragging=null, dragY0=0, dragP0=0;
sheet.addEventListener('pointermove',e=>{
  const r=sheet.getBoundingClientRect();
  if(dragging!==null && view==='beam'){
    const pad=76, wpx=(r.width-40)-pad;
    BEAM.loads[dragging].a=Math.max(0,Math.min(BEAM.L,((e.clientX-r.left)-pad)/wpx*BEAM.L));
    BEAM.loads[dragging].P=Math.max(0.5,Math.min(40,dragP0+(dragY0-(e.clientY-r.top))*0.12));
    recompute(true); draw(); return;
  }
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  const over=hoverBoxes.find(b=>mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h);
  const was=cursor;
  cursor = over ? Math.max(0,Math.min(1,(mx-over.x)/over.w)) : null;
  if(!(running&&view==='circuit') && cursor!==was) draw();
});
sheet.addEventListener('pointerleave',()=>{ cursor=null; if(!(running&&view==='circuit')) draw(); });
sheet.addEventListener('pointerdown',e=>{
  if(view!=='beam') return;
  const r=sheet.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=null,bd=28;
  Object.entries(loadHandles).forEach(([k,h])=>{
    const dd=Math.hypot(mx-h.x,my-h.y); if(dd<bd){ bd=dd; best=+k; } });
  if(best===null) return;
  e.preventDefault(); beamGhost=beamNow;
  dragging=best; dragY0=my; dragP0=BEAM.loads[best].P;
  sheet.setPointerCapture(e.pointerId);
});
['pointerup','pointercancel'].forEach(ev=>sheet.addEventListener(ev,()=>{dragging=null;}));

playBtn.addEventListener('click',()=>{
  running=!running; playBtn.textContent=running?'Pause':'Play';
  playBtn.setAttribute('aria-pressed',String(running)); if(!running) draw();
});
document.getElementById('clearGhost').addEventListener('click',()=>{
  circuitGhost=null; beamGhost=null; draw(); });
document.getElementById('next').addEventListener('click',()=>setStage(stage+1));
document.getElementById('prev').addEventListener('click',()=>setStage(stage-1));

const VIEWS={circuit:'His circuit', beam:'Your beam'};
tabsEl.innerHTML=Object.entries(VIEWS).map(([k,l])=>
  '<button class="tab" role="tab" data-k="'+k+'" aria-selected="false">'+l+'</button>').join('');
function go(k){
  view=k; stage=0;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.k===k)));
  playBtn.style.display=k==='circuit'?'':'none';
  buildKnobs(); recompute(true); setStage(0);
  if(location.hash.slice(1)!==k) history.replaceState(null,'','#'+k);
}
tabsEl.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) go(b.dataset.k); });
addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(VIEWS[k]) go(k); });

go(VIEWS[location.hash.slice(1)]?location.hash.slice(1):'circuit');
resize(); loop();
</script>
</body>
